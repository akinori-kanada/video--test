# 1本目（パターンA）の検証データ
# ★撮影後、実測値とFitlogの判定値に書き換えてください。
#   いまの数値は「テンプレート確認用のサンプル」です。
#   sample: true のあいだは、動画に「SAMPLE DATA」の透かしが入ります（誤投稿防止）。
sample: true

meal_name: いつもの減量定食
manual_time: 約3分          # いつもの「計量→入力」にかかった実時間（ストップウォッチで計測）

# 自分で計量・計算した値（1品ずつ）。合計は自動計算されます。
items:
  - {name: 白米,     g: 150, kcal: 234, P: 3.8,  F: 0.5, C: 55.7}
  - {name: 鶏むね肉, g: 150, kcal: 174, P: 34.9, F: 2.9, C: 0.0}
  - {name: 卵,       g: 50,  kcal: 71,  P: 6.1,  F: 5.1, C: 0.2}
  - {name: 納豆,     g: 45,  kcal: 85,  P: 7.4,  F: 4.5, C: 5.4}
  - {name: 味噌汁,   g: 200, kcal: 40,  P: 2.5,  F: 1.2, C: 4.5}

# Fitlogの結果画面に出た数値（写真1枚の判定）
fitlog: {kcal: 590, P: 50.2, F: 15.8, C: 63.1}

# 差がこの範囲内なら緑、超えたらオレンジで表示（評価の言葉は付けません）
thresholds: {kcal: 50, P: 5, F: 5, C: 10}

# 本人コメント用（実際に使った感想に合わせて書き換え）
verdict:
  good: ごはん・鶏むね
  bad: 味噌汁の量
